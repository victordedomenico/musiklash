<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">MusiKlash — Fais s'affronter tes sons</title>
  <desc id="description">Brackets, tierlists, blindtests, BattleFeat et Stream Clash.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset=".48" stop-color="#14101f"/>
      <stop offset="1" stop-color="#1a0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="15%" r="75%">
      <stop offset="0" stop-color="#ff2f6d" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#ff6b2c" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2f6d"/>
      <stop offset="1" stop-color="#ff6b2c"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#ff2f6d" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(72 64)">
    <rect width="72" height="72" rx="18" fill="url(#mark)" filter="url(#shadow)"/>
    <path d="M38 20 18 36l20 16M34 36h32M62 20l20 16-20 16" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="8" transform="translate(-5 0) scale(.88)"/>
    <text x="96" y="49" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" letter-spacing="-2">MusiKlash</text>
    <text x="98" y="78" fill="#ffffffb8" font-family="Arial, Helvetica, sans-serif" font-size="24">Fais s'affronter tes sons</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="315" fill="#fff" font-size="52" font-weight="800" letter-spacing="-1">Tes débats musicaux méritent</text>
    <text x="72" y="378" fill="#fff" font-size="52" font-weight="800" letter-spacing="-1">un vrai champion.</text>
    <text x="72" y="433" fill="#ffffffd1" font-size="27">Crée, vote, écoute et partage tes classements.</text>
  </g>
  <g transform="translate(72 507)" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">
    <g fill="#ffffff0f" stroke="#ffffff38"><rect width="129" height="42" rx="21"/><rect x="143" width="122" height="42" rx="21"/><rect x="279" width="128" height="42" rx="21"/><rect x="421" width="136" height="42" rx="21"/><rect x="571" width="145" height="42" rx="21"/></g>
    <g fill="#fff" text-anchor="middle"><text x="64" y="27">Brackets</text><text x="204" y="27">Tierlists</text><text x="343" y="27">Blindtests</text><text x="489" y="27">BattleFeat</text><text x="643" y="27">Stream Clash</text></g>
  </g>
</svg>
